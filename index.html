<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work & Purchase Tracking System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2440;--mut:#6b7494;--bd:#e5e8f2;--pri:#4f5bd5;--side:#0f1f4a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151c33;--tx:#e8ecfa;--mut:#8f9ac0;--bd:#26304f;--side:#081033;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Sarabun","Noto Sans Thai",system-ui,sans-serif}
.app{display:flex;min-height:100vh}
aside{width:230px;background:var(--side);color:#cfd6f5;padding:18px 14px;flex-shrink:0}
.logo{font-weight:700;font-size:17px;color:#fff;margin:4px 8px 22px}
.nav{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:10px 12px;border-radius:9px;cursor:pointer;margin-bottom:4px}
.nav:hover{background:rgba(255,255,255,.07)}.nav.on{background:var(--pri);color:#fff}
main{flex:1;min-width:0;padding:24px 28px}
h1{margin:0 0 2px;font-size:24px}.sub{color:var(--mut);margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.stat{border-radius:12px;color:#fff;padding:16px 18px}.stat b{display:block;font-size:30px;line-height:1.2}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.box h3{margin:0 0 12px;font-size:15px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th{color:var(--mut);font-weight:500;text-align:left;font-size:12px}th,td{padding:8px 6px;border-bottom:1px solid var(--bd)}
input,select,button.b{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 9px}
button.b{background:var(--pri);color:#fff;border-color:var(--pri);cursor:pointer}button.b.g{background:var(--card);color:var(--tx);border-color:var(--bd)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.tag{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;color:#fff;white-space:nowrap}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--pri)}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.donut span{width:84px;height:84px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:18px}
.late{color:#e5484d;font-weight:600}.mut{color:var(--mut)}
@media(max-width:800px){.app{flex-direction:column}aside{width:auto;display:flex;gap:4px;overflow-x:auto;padding:10px}.logo{display:none}.nav{width:auto;white-space:nowrap;margin:0}main{padding:16px}}
</style></head><body>
<div class="app"><aside><div class="logo">▣ WorkFlow PR</div><div id="nav"></div><div id="me" style="margin-top:18px;font-size:12px"></div></aside><main id="v"></main></div>
<script>
/* ===== CONFIG: วาง URL ของ Web App (ลงท้ายด้วย /exec) ระหว่างเครื่องหมายคำพูด ===== */
var API="https://script.google.com/macros/s/AKfycbwPq6JuvGpS3qvI8omsapXoNMNvCiWhtSti2OJ0zmTjCpEL3xkOG32D_Oec682_zJGaJQ/exec";
var ST={PR:"รอสั่งซื้อ",PO:"สั่งซื้อแล้ว",SH:"กำลังจัดส่ง",DL:"ได้รับแล้ว"},COL={PR:"#f59e0b",PO:"#4f5bd5",SH:"#2f8fe8",DL:"#1fb58a"};
var MENU=[["dash","Dashboard"],["work","Work Tracking"],["pr","PR Management"],["po","PO Tracking"],["del","Delivery Tracking"],["rep","Reports"]];
var D={tasks:[],prs:[],hist:[],quotes:[]};
var cur="dash";
function save(){try{localStorage.setItem("wpts",JSON.stringify(D))}catch(e){}}
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){return new Date().toISOString().slice(0,10)}
function tag(s){return '<span class="tag" style="background:'+COL[s]+'">'+ST[s]+'</span>'}
function tst(p){return p>=100?["เสร็จแล้ว","#1fb58a"]:p>0?["กำลังทำ","#2f8fe8"]:["ยังไม่เริ่ม","#8f9ac0"]}
function opts(o,v){return Object.keys(o).map(function(k){return '<option value="'+k+'"'+(k==v?" selected":"")+'>'+o[k]+'</option>'}).join("")}
function nav(){document.getElementById("nav").innerHTML=MENU.map(function(m,i){return '<button class="nav'+(m[0]==cur?" on":"")+'" onclick="go(\''+m[0]+'\')">'+(i+1)+". "+m[1]+'</button>'}).join("")}
function go(v){cur=v;nav();document.getElementById("v").innerHTML=V[v]();window.scrollTo(0,0)}
function head(t,s){return "<h1>"+t+"</h1><p class='sub'>"+s+"</p>"}
function cnt(){var c={PR:0,PO:0,SH:0,DL:0};D.prs.forEach(function(r){c[r.s]++});return c}
var V={
dash:function(){var c=cnt(),n=D.prs.length||1,tk=D.tasks,doing=tk.filter(function(x){return x.st=="I"}).length,done=tk.filter(function(x){return x.st=="C"}).length,todo=tk.length-doing-done,tot=tk.length||1;
var a=Math.round(done/tot*100),b=a+Math.round(doing/tot*100);
var bars=Object.keys(ST).map(function(k){return '<div style="margin-bottom:10px"><div class="row" style="justify-content:space-between;margin:0"><span>'+ST[k]+'</span><b>'+c[k]+'</b></div><div class="bar"><i style="width:'+c[k]/n*100+'%;background:'+COL[k]+'"></i></div></div>'}).join("");
var late=D.prs.filter(function(r){return r.s!="DL"&&r.eta&&r.eta<today()}).length;
return head("Dashboard","ภาพรวมงานและสถานะ PR")+'<div class="cards"><div class="stat" style="background:#2f8fe8">งานทั้งหมด<b>'+tk.length+'</b></div><div class="stat" style="background:#1fb58a">กำลังทำ<b>'+doing+'</b></div><div class="stat" style="background:#7c5cd6">PR ทั้งหมด<b>'+D.prs.length+'</b></div><div class="stat" style="background:#f59e0b">ส่งของล่าช้า<b>'+late+'</b></div><div class="stat" style="background:#e5484d">ใบเสนอราคาใกล้หมดอายุ<b>'+expList().length+'</b></div></div>'+
'<div class="grid2"><div class="box"><h3>สถานะ PR</h3>'+bars+'</div><div class="box"><h3>สถานะงาน</h3><div class="row" style="gap:20px"><div class="donut" style="background:conic-gradient(#1fb58a 0 '+a+'%,#2f8fe8 '+a+'% '+b+'%,#c3c9e0 '+b+'% 100%)"><span>'+tk.length+'</span></div><div>เสร็จแล้ว '+done+'<br>กำลังทำ '+doing+'<br>ยังไม่เริ่ม '+todo+'</div></div></div></div>'+
'<div class="box"><h3>งานล่าสุด</h3><div class="tw"><table><tr><th>งาน</th><th>ผู้รับผิดชอบ</th><th>กำหนดส่ง</th><th>ความคืบหน้า</th></tr>'+tk.slice(-5).reverse().map(function(x){return '<tr><td>'+esc(x.t)+'</td><td>'+esc(x.a)+'</td><td>'+esc(x.d)+'</td><td><div class="bar"><i style="width:'+x.p+'%"></i></div></td></tr>'}).join("")+'</table></div></div>'},
work:function(){return head("Work Tracking","สร้างงาน มอบหมายงาน และติดตามความคืบหน้า")+'<div class="box"><div class="row"><input id="tt" placeholder="ชื่องาน" style="flex:2;min-width:180px"><input id="ta" placeholder="ผู้รับผิดชอบ"><input id="td" type="date"><button class="b" onclick="addT()">+ สร้างงาน</button></div><div class="tw"><table><tr><th>งาน</th><th>ผู้รับผิดชอบ</th><th>กำหนดส่ง</th><th>ความคืบหน้า</th><th>สถานะ</th><th></th></tr>'+
D.tasks.map(function(x,i){var s=tst(x.p),l=x.p<100&&x.d&&x.d<today();return '<tr><td>'+esc(x.t)+'</td><td>'+esc(x.a)+'</td><td class="'+(l?"late":"")+'">'+esc(x.d)+'</td><td><select onchange="D.tasks['+i+'].p=+this.value;save();go(\'work\')">'+[0,25,50,75,100].map(function(p){return '<option'+(p==x.p?" selected":"")+' value="'+p+'">'+p+'%</option>'}).join("")+'</select></td><td><span class="tag" style="background:'+s[1]+'">'+s[0]+'</span></td><td><button class="b g" onclick="D.tasks.splice('+i+',1);save();go(\'work\')">ลบ</button></td></tr>'}).join("")+'</table></div></div>'},
pr:function(){return head("PR Management","Import PR จาก Excel และติดตามสถานะ")+'<div class="box"><div class="row"><input type="file" id="xf" accept=".xlsx,.xls,.csv"><span class="mut">คอลัมน์: PR No, Item, Qty, Requester, Date (เรียงตามลำดับหรือใช้ชื่อหัวตาราง)</span></div><div class="tw"><table><tr><th>PR No</th><th>รายการ</th><th>จำนวน</th><th>ผู้ขอ</th><th>วันที่</th><th>สถานะ</th><th></th></tr>'+
D.prs.map(function(r,i){return '<tr><td>'+esc(r.pr)+'</td><td>'+esc(r.item)+'</td><td>'+esc(r.qty)+'</td><td>'+esc(r.req)+'</td><td>'+esc(r.date)+'</td><td><select onchange="D.prs['+i+'].s=this.value;save();go(\'pr\')">'+opts(ST,r.s)+'</select></td><td><button class="b g" onclick="D.prs.splice('+i+',1);save();go(\'pr\')">ลบ</button></td></tr>'}).join("")+'</table></div></div>'},
po:function(){return head("PO Tracking","ติดตามข้อมูลการสั่งซื้อ")+'<div class="box"><div class="tw"><table><tr><th>PR No</th><th>รายการ</th><th>PO No</th><th>ซัพพลายเออร์</th><th>กำหนดส่ง (ETA)</th><th>สถานะ</th></tr>'+
D.prs.map(function(r,i){function f(k,t){return '<input '+(t||"")+' value="'+esc(r[k])+'" onchange="setPO('+i+',\''+k+'\',this.value)" style="width:100%;min-width:110px">'}return '<tr><td>'+esc(r.pr)+'</td><td>'+esc(r.item)+'</td><td>'+f("po")+'</td><td>'+f("sup")+'</td><td>'+f("eta",'type="date"')+'</td><td>'+tag(r.s)+'</td></tr>'}).join("")+'</table></div></div>'},
del:function(){var L=D.prs.filter(function(r){return r.s!="PR"});return head("Delivery Tracking","ติดตามการจัดส่งสินค้า")+'<div class="box"><div class="tw"><table><tr><th>PR No</th><th>รายการ</th><th>PO No</th><th>ETA</th><th>สถานะ</th><th>เปลี่ยนสถานะ</th></tr>'+
(L.length?L.map(function(r){var i=D.prs.indexOf(r),late=r.s!="DL"&&r.eta&&r.eta<today();return '<tr><td>'+esc(r.pr)+'</td><td>'+esc(r.item)+'</td><td>'+esc(r.po)+'</td><td class="'+(late?"late":"")+'">'+esc(r.eta)+(late?" (ล่าช้า)":"")+'</td><td>'+tag(r.s)+'</td><td><select onchange="D.prs['+i+'].s=this.value;save();go(\'del\')">'+opts({PO:ST.PO,SH:ST.SH,DL:ST.DL},r.s)+'</select></td></tr>'}).join(""):'<tr><td colspan="6" class="mut">ยังไม่มีรายการที่สั่งซื้อ</td></tr>')+'</table></div></div>'},
rep:function(){var c=cnt();return head("Reports","สรุปรายงานและ Export Excel")+'<div class="cards">'+Object.keys(ST).map(function(k){return '<div class="stat" style="background:'+COL[k]+'">'+ST[k]+'<b>'+c[k]+'</b></div>'}).join("")+'</div><div class="box"><h3>Export Excel</h3><div class="row"><button class="b" onclick="exp(\'all\')">รายงานทั้งหมด (งาน + PR)</button><button class="b g" onclick="exp(\'tasks\')">เฉพาะงาน</button><button class="b g" onclick="exp(\'prs\')">เฉพาะ PR/PO/จัดส่ง</button></div><p id="msg" class="mut"></p></div>'}
};
function addT(){var t=document.getElementById("tt").value.trim();if(!t)return;D.tasks.push({t:t,a:document.getElementById("ta").value,d:document.getElementById("td").value,p:0});save();go("work")}
function setPO(i,k,v){var r=D.prs[i];r[k]=v;if(r.s=="PR"&&r.po)r.s="PO";save();go("po")}
function pick(row,re,idx){var k=Object.keys(row);for(var j=0;j<k.length;j++)if(re.test(k[j]))return row[k[j]];return row[k[idx]]}
document.addEventListener("change",function(e){if(e.target.id!="xf"||!e.target.files[0])return;var fr=new FileReader();fr.onload=function(){try{var wb=XLSX.read(fr.result,{type:"array",cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{raw:false}),n=0;
rows.forEach(function(r){var pr=pick(r,/pr/i,0);if(!pr)return;D.prs.push({pr:String(pr),item:pick(r,/item|desc|รายการ/i,1)||"",qty:pick(r,/qty|quantity|จำนวน/i,2)||"",req:pick(r,/request|ผู้ขอ/i,3)||"",date:pick(r,/date|วันที่/i,4)||"",s:"PR",po:"",sup:"",eta:""});n++});save();go("pr");alert("นำเข้า "+n+" รายการ")}catch(x){alert("อ่านไฟล์ไม่สำเร็จ")}};fr.readAsArrayBuffer(e.target.files[0])});
async function exp(w){var m=document.getElementById("msg"),dl=null;try{dl=await claude.use("downloads")}catch(e){}
if(!dl){m.textContent="ไม่สามารถดาวน์โหลดไฟล์ในเวอร์ชันนี้ได้";return}
var wb=XLSX.utils.book_new();
if(w!="prs")XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.tasks.map(function(x){return{"Job ID":x.id,"งาน":x.t,"รายละเอียด":x.desc,"ลูกค้า/แผนก":x.cust,"ผู้รับผิดชอบ":x.a,"Priority":PRI[x.pri],"Start":x.start,"Due":x.d,"ความคืบหน้า %":x.p,"สถานะ":WS[x.st],"Linked PR":x.prs.join(", "),"Work Tasks":x.wt.map(function(t){return(t.done?"[x] ":"[ ] ")+t.t}).join(" | "),"เกินกำหนด":isLate(x)?"ใช่":"","บันทึกติดตาม":x.notes.map(function(n){return n.d+" "+n.by+": "+n.txt}).join(" | ")}})),"Work");
if(w!="tasks")XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.prs.map(function(r){return{"PR No":r.pr,"รายการ":r.item,"จำนวน":r.qty,"ผู้ขอ":r.req,"วันที่ PR":r.date,"PO No":r.po,"ซัพพลายเออร์":r.sup,"ETA":r.eta,"สถานะ":ST[r.s],"Work Job":jobsOf(r.pr).map(function(q){return q.id}).join(", "),"Approval":(apr(r)||["-"])[0]}})),"PR-PO-Delivery");
try{await dl.save({filename:"report-"+today()+".xlsx",data:new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})])});m.textContent="ส่งออกแล้ว"}catch(e){m.textContent="ยกเลิกหรือบันทึกไม่สำเร็จ"}}
var WS={O:"Open",I:"In Progress",H:"On Hold",C:"Completed",X:"Cancelled"},WC={O:"#8f9ac0",I:"#2f8fe8",H:"#f59e0b",C:"#1fb58a",X:"#e5484d"},PRI={H:"สูง",M:"กลาง",L:"ต่ำ"},PC={H:"#e5484d",M:"#f59e0b",L:"#1fb58a"},wsel=-1,wf="all";
D.tasks.forEach(function(x,i){if(!x.id)x.id="JOB-"+String(i+1).padStart(4,"0");if(!x.st)x.st=x.p>=100?"C":x.p>0?"I":"O";x.pri=x.pri||"M";x.notes=x.notes||[];x.desc=x.desc||"";x.cust=x.cust||"";x.start=x.start||""});
function isLate(x){return !!x.d&&x.d<today()&&(x.st=="O"||x.st=="I"||x.st=="H")}
function wtag(x){return '<span class="tag" style="background:'+WC[x.st]+'">'+WS[x.st]+'</span>'}
function upd(i,k,v){var x=D.tasks[i];x[k]=v;if(k=="st"&&v=="C")x.p=100;if(k=="p"){x.p=+v;if(x.p>=100)x.st="C";else if(x.p>0&&x.st=="O")x.st="I"}save();go("work")}
function nextId(){var m=0;D.tasks.forEach(function(x){var n=parseInt(String(x.id).replace(/\D/g,""))||0;if(n>m)m=n});return "JOB-"+String(m+1).padStart(4,"0")}
function addJob(){var g=function(k){return document.getElementById(k).value.trim()},t=g("jt");if(!t){alert("กรุณาระบุชื่องาน");return}D.tasks.push({id:nextId(),t:t,desc:g("jd"),cust:g("jc"),a:g("ja"),pri:g("jp"),start:g("js"),d:g("je"),p:0,st:"O",notes:[],prs:[],wt:[]});save();go("work")}
function addNote(i){var n=document.getElementById("nn").value.trim();if(!n)return;D.tasks[i].notes.push({d:today(),by:document.getElementById("nb").value.trim(),txt:n});save();go("work")}
function delJob(i){if(!confirm("ลบงานนี้?"))return;D.tasks.splice(i,1);wsel=-1;save();go("work")}
function det(i){var x=D.tasks[i];return '<div class="box"><h3>'+esc(x.id)+' · '+esc(x.t)+' '+wtag(x)+(isLate(x)?' <span class="late">เกินกำหนด</span>':'')+'</h3><p>'+esc(x.desc||"-")+'</p><p class="mut">ลูกค้า/แผนก: '+esc(x.cust||"-")+' · ผู้รับผิดชอบ: '+esc(x.a||"-")+' · Priority: '+PRI[x.pri]+' · เริ่ม '+esc(x.start||"-")+' · ครบกำหนด '+esc(x.d||"-")+'</p><div class="row"><select onchange="upd('+i+',\'st\',this.value)">'+opts(WS,x.st)+'</select><button class="b g" onclick="wsel=-1;go(\'work\')">ปิด</button></div><h3>ความคิดเห็น / บันทึกการติดตาม</h3>'+(x.notes.length?x.notes.map(function(n){return '<div style="border-left:3px solid var(--pri);padding:2px 10px;margin-bottom:8px"><span class="mut">'+esc(n.d)+' · '+esc(n.by||"ไม่ระบุ")+'</span><br>'+esc(n.txt)+'</div>'}).join(""):'<p class="mut">ยังไม่มีบันทึก</p>')+'<div class="row"><input id="nb" placeholder="ชื่อผู้บันทึก"><input id="nn" placeholder="เพิ่มความคิดเห็น..." style="flex:1;min-width:200px"><button class="b" onclick="addNote('+i+')">เพิ่ม</button></div></div>'}
V.work=function(){var T=D.tasks,late=T.filter(isLate).length,ip=T.filter(function(x){return x.st=="I"}).length;

async function delF(k){try{await api("delFile",{key:k})}catch(e){}}
async function boot(){nav();var v=document.getElementById("v");
if(!API||API.indexOf("PASTE")==0){v.innerHTML='<div class="box"><h3>ยังไม่ได้ตั้งค่า</h3><p>เปิดไฟล์ index.html แล้วแก้ค่า API ที่บรรทัดแรกของสคริปต์ให้เป็น URL ของ Web App (ลงท้ายด้วย /exec)</p></div>';return}
var t=ls("wpts_tok"),nm=ls("wpts_name");if(!t||!nm){askGate("");return}
TOKEN=t;USER={name:nm};v.innerHTML='<p class="mut">กำลังโหลดข้อมูล...</p>';
try{await startApp()}catch(e){TOKEN="";if(e.message=="unauthorized")askGate("เซสชันหมดอายุหรือมีการเปลี่ยนรหัส กรุณาใส่รหัสทีมอีกครั้ง");else v.innerHTML='<div class="box"><h3>เชื่อมต่อไม่สำเร็จ</h3><p>'+esc(e.message)+'</p><button class="b" onclick="boot()">ลองใหม่</button></div>'}}
boot();
</script></body></html>
